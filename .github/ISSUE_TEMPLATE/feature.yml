name: Feature request
description: Suggest an improvement to OpenDepartment.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Describe the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you considered, or say if there are none.
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who is it for?
      options:
        - department member
        - department administrator
        - platform operator / self-hoster
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
