name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to see the problem.
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Where did it happen?
      options:
        - landing/marketing pages
        - setup wizard
        - inside a department
        - account page
        - other
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - opendepartment.vercel.app
        - my own deployment with Supabase cloud
        - my own deployment with self-hosted Supabase
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      description: Include browser and operating system versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / logs (optional)
      description: Remove keys, e-mail addresses and other personal data before sharing screenshots or logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: No secrets or personal data
      options:
        - label: I confirm that I have not pasted a service_role key, secret key or personal data in this report or its attachments.
          required: true
