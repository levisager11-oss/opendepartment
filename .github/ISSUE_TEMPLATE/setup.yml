name: Setup problem
description: Report a problem creating or connecting a department's Supabase project.
labels: [setup]
body:
  - type: dropdown
    id: step
    attributes:
      label: Which step failed?
      description: >-
        Supabase project creates the project; SQL installs the wizard's personalised schema;
        E-mail configures Confirm email or your own SMTP; Connect checks the project URL
        and anon / publishable key, then registers the department's address.
      options:
        - Supabase project
        - SQL
        - E-mail
        - Connect
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Where does your Supabase project run?
      options:
        - Supabase cloud (supabase.com)
        - Self-hosted Supabase
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: What did you do?
      description: Describe the steps you took before the problem occurred. Do not include keys or private founder links.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What happened (the exact error message)?
      description: Copy the exact error message, removing secrets and personal data. If no error appeared, describe what you saw.
    validations:
      required: true
  - type: dropdown
    id: one-click
    attributes:
      label: Did you use one-click setup?
      options:
        - "yes"
        - "no"
        - "not sure"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Remove keys, private founder links, e-mail addresses and other personal data before sharing logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: No secrets or personal data
      options:
        - label: I confirm that I have not pasted a service_role key, secret key or personal data in this report or its attachments.
          required: true
